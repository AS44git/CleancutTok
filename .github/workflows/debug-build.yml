# Builds a test APK of CleancutTok: the patch bundle from this repo, applied to
# the stock TikTok APK on the draft release "stock-apk", as a clone that
# installs next to any other TikTok (package com.zhiliaoapp.musically.cleancuttok).
#
# Signed with a throwaway key and uploaded as a workflow artifact, not a
# release. The key changes every run: uninstall the previous build first.

name: Debug build

on:
  workflow_dispatch:
    inputs:
      stock_apk:
        description: "Stock TikTok APK: release:NAME (an .apk on that release, drafts too) or a direct https:// link"
        required: true
        default: "release:stock-apk"
      app_name:
        description: "Name under the clone's icon"
        required: false
        default: "Tiktok"
      morphe_cli_version:
        description: "Morphe CLI (morphe-desktop) release tag, 1.20.0 or newer"
        required: false
        default: "v1.20.0"
      morphe_patches_version:
        description: "Morphe's own patch bundle release tag (for Clone app)"
        required: false
        default: "v2.0.0"

permissions:
  # write: draft releases (where the stock APK is kept) are only listed to
  # tokens with push access. This workflow publishes nothing.
  contents: write
  packages: read

env:
  # TikTok's signing certificate (SHA-256), as Hushfeed records it for 47.6.3.
  TIKTOK_SIGNER: 9041803e91bcb814b4b4399fb5c85a91640b755e5e8ba76813814bf4cf2ab5ba
  CLONE_PACKAGE: com.zhiliaoapp.musically.cleancuttok

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # GitHub's Ubuntu runners ship the Android SDK (ANDROID_HOME).
      - name: Install Android build tools
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build the patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GPR_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :patches:buildAndroid
          ls -l patches/build/libs/
          mpp="$(ls -t patches/build/libs/*.mpp | head -1)"
          echo "BUNDLE=$mpp" >> "$GITHUB_ENV"

      - name: Fetch the Morphe CLI and Morphe's patch bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p tools/cli tools/morphe
          gh release download "${{ inputs.morphe_cli_version }}" -R MorpheApp/morphe-cli -p '*.jar' -D tools/cli/
          gh release download "${{ inputs.morphe_patches_version }}" -R MorpheApp/morphe-patches -p '*.mpp' -D tools/morphe/
          ls -l tools/cli tools/morphe
          echo "CLI=$(ls -S tools/cli/*.jar | head -1)" >> "$GITHUB_ENV"
          echo "MORPHE_BUNDLE=$(ls -t tools/morphe/*.mpp | head -1)" >> "$GITHUB_ENV"

      - name: Fetch and verify the stock TikTok APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          file="$(bash .github/scripts/fetch-stock-apk.sh "${{ inputs.stock_apk }}")"
          apksigner="$(ls -t "$ANDROID_HOME"/build-tools/*/apksigner | head -1)"
          signer="$("$apksigner" verify --print-certs "$file" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)"
          echo "signer: $signer"
          if [ "$signer" != "$TIKTOK_SIGNER" ]; then
            echo "::error::$file is not signed by TikTok (got $signer). Use the untouched APKMirror download."
            exit 1
          fi
          aapt2="$(ls -t "$ANDROID_HOME"/build-tools/*/aapt2 | head -1)"
          "$aapt2" dump badging "$file" | head -1
          echo "STOCK_APK=$file" >> "$GITHUB_ENV"

      - name: Patch TikTok into a debug clone
        run: |
          mkdir -p dist build
          sha="$(git rev-parse --short HEAD)"
          out="dist/cleancuttok-debug-$sha-clone.apk"
          java -Xmx5g -jar "$CLI" patch \
            -p "$BUNDLE" \
              -e "Run beside the store app" \
              -e "Change app name" -OappName="${{ inputs.app_name }}" \
            -p "$MORPHE_BUNDLE" \
              -e "Clone app" -OpackageName="$CLONE_PACKAGE" \
            --striplibs arm64-v8a \
            -r build/patch-result.json \
            -o "$out" \
            "$STOCK_APK"
          cp build/patch-result.json dist/ || true
          python3 - build/patch-result.json <<'EOF' || true
          import json, sys
          r = json.load(open(sys.argv[1]))
          name = lambda p: p if isinstance(p, str) else p.get("name")
          for p in r.get("appliedPatches", []): print("    ok  ", name(p))
          for p in r.get("failedPatches", []): print("    FAIL", name(p), "" if isinstance(p, str) else (p.get("exception") or p.get("error") or ""))
          EOF
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: dist/
          retention-days: 7
