# Builds CleancutTok from the stock TikTok APK and publishes it as a GitHub release, which is
# what the in-app updater checks. Two APKs per release:
#   cleancuttok-<tag>-clone.apk  installs beside TikTok (package com.zhiliaoapp.musically.cleancuttok)
#   cleancuttok-<tag>.apk        replaces TikTok (uninstall the store TikTok first)
#
# Run it from the Actions tab ("Build and release" -> Run workflow).
#
# One-time setup (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64   your signing keystore, base64-encoded
#   KEYSTORE_PASS     the keystore password
#   KEY_PASS          the key password (optional, defaults to KEYSTORE_PASS)
#   KEY_ALIAS         the key's alias (optional: the keystore's first key is used)
#
# Always sign with the same keystore: Android refuses an update signed with a different key,
# so losing it means uninstalling and signing in again.
#
# The tag is TikTok's version plus Brand.REVISION (extensions/.../cleancut/Brand.java):
# TikTok 47.6.3 at revision 1 -> v47-6-3-1. Bump REVISION for each new release.

name: Build and release

on:
  workflow_dispatch:
    inputs:
      stock_apk:
        description: "Stock TikTok APK: release:NAME (an .apk on that release, drafts too) or a direct https:// link"
        required: true
        default: "release:stock-apk"
      notes:
        description: "Release notes (shown in the app's update dialog)"
        required: false
        default: ""
      app_name:
        description: "Name under the app icon"
        required: false
        default: "Tiktok"
      prerelease:
        description: "Mark as a pre-release (the updater only offers the latest full release)"
        type: boolean
        default: false
      morphe_cli_version:
        description: "Morphe CLI (morphe-desktop) release tag"
        required: false
        default: "v1.20.0"
      morphe_patches_version:
        description: "Morphe's own patch bundle release tag (for Clone app)"
        required: false
        default: "v2.0.0"

permissions:
  contents: write
  packages: read

env:
  TIKTOK_SIGNER: 9041803e91bcb814b4b4399fb5c85a91640b755e5e8ba76813814bf4cf2ab5ba
  CLONE_PACKAGE: com.zhiliaoapp.musically.cleancuttok

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android build tools
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASS" ]; then
            echo "::error::KEYSTORE_BASE64 and KEYSTORE_PASS must be set. Releases are signed with your own key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          alias="$KEY_ALIAS"
          if [ -z "$alias" ]; then
            alias="$(keytool -list -v -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KEYSTORE_PASS" \
              | sed -n 's/^Alias name: //p' | head -1)"
          fi
          if [ -z "$alias" ]; then echo "::error::No key found in the keystore"; exit 1; fi
          echo "signing with key alias: $alias"
          echo "KEY_ALIAS_RESOLVED=$alias" >> "$GITHUB_ENV"

      - name: Build the patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GPR_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :patches:generatePatchesList
          ./gradlew --no-daemon --stacktrace :patches:buildAndroid
          mpp="$(ls -t patches/build/libs/*.mpp | head -1)"
          echo "BUNDLE=$mpp" >> "$GITHUB_ENV"

      - name: Fetch the Morphe CLI and Morphe's patch bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p tools/cli tools/morphe
          gh release download "${{ inputs.morphe_cli_version }}" -R MorpheApp/morphe-cli -p '*.jar' -D tools/cli/
          gh release download "${{ inputs.morphe_patches_version }}" -R MorpheApp/morphe-patches -p '*.mpp' -D tools/morphe/
          echo "CLI=$(ls -S tools/cli/*.jar | head -1)" >> "$GITHUB_ENV"
          echo "MORPHE_BUNDLE=$(ls -t tools/morphe/*.mpp | head -1)" >> "$GITHUB_ENV"

      - name: Fetch and verify the stock TikTok APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          file="$(bash .github/scripts/fetch-stock-apk.sh "${{ inputs.stock_apk }}")"
          apksigner="$(ls -t "$ANDROID_HOME"/build-tools/*/apksigner | head -1)"
          signer="$("$apksigner" verify --print-certs "$file" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)"
          if [ "$signer" != "$TIKTOK_SIGNER" ]; then
            echo "::error::$file is not signed by TikTok (got $signer). Use the untouched APKMirror download."
            exit 1
          fi
          echo "STOCK_APK=$file" >> "$GITHUB_ENV"
          echo "APKSIGNER=$apksigner" >> "$GITHUB_ENV"

      - name: Patch the replace and clone builds
        run: |
          mkdir -p dist build
          # Replaces TikTok: keeps TikTok's package name.
          java -Xmx5g -jar "$CLI" patch \
            -p "$BUNDLE" \
              -e "Look like the store app" \
              -e "Change app name" -OappName="${{ inputs.app_name }}" \
            --striplibs arm64-v8a \
            -r build/result-main.json \
            -o dist/main-unsigned.apk \
            "$STOCK_APK"
          # Installs beside TikTok.
          java -Xmx5g -jar "$CLI" patch \
            -p "$BUNDLE" \
              -e "Run beside the store app" \
              -e "Look like the store app" \
              -e "Change app name" -OappName="${{ inputs.app_name }}" \
            -p "$MORPHE_BUNDLE" \
              -e "Clone app" -OpackageName="$CLONE_PACKAGE" \
            --striplibs arm64-v8a \
            -r build/result-clone.json \
            -o dist/clone-unsigned.apk \
            "$STOCK_APK"
          for r in build/result-main.json build/result-clone.json; do
            python3 - "$r" <<'EOF'
          import json, sys
          r = json.load(open(sys.argv[1]))
          name = lambda p: p if isinstance(p, str) else p.get("name")
          applied = [name(p) for p in r.get("appliedPatches", [])]
          failed = [name(p) for p in r.get("failedPatches", [])]
          print(sys.argv[1], len(applied), "applied,", len(failed), "failed", failed)
          if "CleancutTok" not in applied:
              sys.exit("the CleancutTok patch did not apply")
          EOF
          done

      - name: Sign with the release key
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS || secrets.KEYSTORE_PASS }}
        run: |
          for kind in main clone; do
            "$APKSIGNER" sign \
              --ks "$RUNNER_TEMP/release.keystore" \
              --ks-key-alias "$KEY_ALIAS_RESOLVED" \
              --ks-pass env:KEYSTORE_PASS \
              --key-pass env:KEY_PASS \
              --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
              --v4-signing-enabled false \
              --out "dist/$kind.apk" "dist/$kind-unsigned.apk"
            "$APKSIGNER" verify "dist/$kind.apk"
            rm "dist/$kind-unsigned.apk"
          done
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Work out the version
        run: |
          aapt2="$(ls -t "$ANDROID_HOME"/build-tools/*/aapt2 | head -1)"
          version="$("$aapt2" dump badging dist/main.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          if [ -z "$version" ]; then echo "::error::could not read versionName"; exit 1; fi
          brand=extensions/tiktok/src/main/java/app/morphe/extension/tiktok/cleancut/Brand.java
          revision="$(sed -n 's/.*int REVISION = \([0-9][0-9]*\);.*/\1/p' "$brand")"
          if [ -z "$revision" ]; then echo "::error::could not read REVISION from Brand.java"; exit 1; fi
          tag="v${version//./-}-$revision"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          mv dist/main.apk "dist/cleancuttok-$tag.apk"
          mv dist/clone.apk "dist/cleancuttok-$tag-clone.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -l dist; cat dist/SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ inputs.notes }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump REVISION in Brand.java for a new release."
            exit 1
          fi
          args=("$TAG" dist/*.apk dist/SHA256SUMS.txt --title "CleancutTok $TAG")
          if [ -n "$NOTES" ]; then args+=(--notes "$NOTES"); else args+=(--notes "CleancutTok $TAG for TikTok $(echo "$TAG" | cut -d- -f1-3 | tr - . | sed 's/^v//')."); fi
          [ "${{ inputs.prerelease }}" = "true" ] && args+=(--prerelease)
          gh release create "${args[@]}"
